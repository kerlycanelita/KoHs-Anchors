# KoHs Anchor's build matrix.
#
# One line per supported Minecraft version:
#
#   <minecraft> = <fabric_loader>, <fabric_api>, <mod_menu>, <java_release>
#
# `build.gradle` reads this file, so a build only needs the Minecraft version:
#
#   gradlew build "-Pmc=26.2"
#
# (Quote the -P argument in PowerShell, or it is split and Gradle receives "26".)
#
# Fabric API is only used by the development client (`runClient`); the mod itself does not
# depend on it. The Fabric Loader entry becomes the `depends.fabricloader` floor in the published
# fabric.mod.json, so raising it without rebuilding locks players out.
#
# Source eras (see build.gradle):
#   26.2, 26.3            modern  - compiled straight from src/client/java
#   26.1, 26.1.1, 26.1.2  classic - src/compat/classic replaces the compat layer
#   1.21.11               legacy  - src/compat/legacy, GUI renamed to the 1.21 API, remapped

1.21.11 = 0.18.4, 0.141.6+1.21.11, 17.0.0, 21
26.1    = 0.18.6, 0.145.1+26.1,    18.0.0, 25
