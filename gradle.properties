org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Default target when no -Pmc is given: 26.2 is the development focus. Everything below the
# Minecraft version is filled in from gradle/versions.properties, so only mod_version usually
# needs editing here.
minecraft_version=26.2
loom_version=1.17-SNAPSHOT

mod_version=0.6.0
maven_group=dev.zymekoh
archives_base_name=kohs-anchors

# Decodes the glowstone guard warning's clip; bundled in the jar.
jcodec_version=0.2.5

# Fallbacks for a Minecraft version that is not in the build matrix yet.
loader_version=0.19.3
modmenu_version=20.0.1
fabric_version=0.156.0+26.2
