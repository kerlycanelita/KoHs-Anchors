name: Release

# Builds KoHs Anchor's for every Minecraft version, checks every Mixin target against that
# version's bytecode, and publishes the jars with their SHA-256 sums on a GitHub release:
#
# - publishing a release on GitHub (tag v0.4.0, say) adds the jars to it;
# - pushing a tag such as v0.4.0 creates the release with them.
#
# A release without notes takes that version's section of CHANGELOG.md.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A release published on a new tag also pushes the tag: the two runs take turns.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build every Minecraft version and check its Mixin targets
        run: bash tools/build-all.sh

      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog's links are relative to the repository; a release page needs them whole.
          awk -v heading="## ${version} " 'index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }' CHANGELOG.md \
              | sed "s#](docs/#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/#g" > notes.md
          test -s notes.md || echo "KoHs Anchor's ${version}." > notes.md

      - name: Publish the jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          files=(dist/"${version}"/*.jar dist/"${version}"/CHECKSUMS.sha256)
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
            if [ -z "$(gh release view "${tag}" --json body --jq .body)" ]; then
              gh release edit "${tag}" --notes-file notes.md
            fi
          else
            gh release create "${tag}" "${files[@]}" --title "KoHs Anchor's ${version}" \
                --notes-file notes.md --verify-tag
          fi
